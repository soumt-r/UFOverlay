name: CI

on:
  push:
    branches: [main]
    tags: ["v*"] # a v* tag also publishes a GitHub Release with the zip
  pull_request:
  workflow_dispatch: # "Run workflow" button in the Actions tab

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # needed only to attach the zip to a Release
    steps:
      - uses: actions/checkout@v4

      # Installs the version pinned in rust-toolchain.toml (+ clippy, rustfmt).
      - name: Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Test
        run: cargo test

      - name: Package
        shell: pwsh
        run: ./tools/package.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: UFOverlay
          path: dist/*.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
